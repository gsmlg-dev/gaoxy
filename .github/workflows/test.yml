name: Unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  ELIXIR_ERL_OPTIONS: '+S 2:2'
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: '1.18.5'
          otp-version: '28.5'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/cache@v6.1.0
        with:
          path: |
            deps
            _build
          key: unit-${{ runner.os }}-${{ runner.arch }}-1.18.5-28.5-${{ hashFiles('mix.lock', 'examples/phoenix_native/mix.lock', 'vendor/websock_adapter/SOURCE.json') }}
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get --check-locked
      - name: Mocked script unit regressions
        run: |
          python3 scripts/test-check-tests.py
          python3 scripts/test-check-repairs.py
          python3 scripts/test-release-smoke.py
          python3 scripts/test-check-test-inventory.py
      - name: Isolated unit contracts (exact counts, no service requests)
        run: python3 scripts/check-repairs.py unit
