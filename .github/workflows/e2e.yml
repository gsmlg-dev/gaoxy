name: Integration and end-to-end tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: false
        default: ''
        description: Optional published version for additional release-client checks
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  ELIXIR_ERL_OPTIONS: '+S 2:2'
jobs:
  component:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: '1.18.5'
          otp-version: '28.5'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/cache@v6.1.0
        with:
          path: |
            deps
            _build
            examples/phoenix_native/deps
            examples/phoenix_native/_build
          key: component-${{ runner.os }}-${{ runner.arch }}-1.18.5-28.5-${{ hashFiles('mix.lock', 'examples/phoenix_native/mix.lock', 'vendor/websock_adapter/SOURCE.json') }}
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get --check-locked
      - name: Certificate tool and independent fixture peers
        run: |
          sudo apt-get update && sudo apt-get install -y openssl
          python -m venv .audit/h2peer
          .audit/h2peer/bin/python -m pip install -r apps/gaoxy_http/test/support/h2-requirements.txt -r integration/http3/requirements.txt
      - name: Component collaboration (exact counts)
        run: python3 scripts/check-repairs.py component
      - name: Phoenix fixture dependencies
        working-directory: examples/phoenix_native
        env:
          PHOENIX_NATIVE_H3: '1'
        run: mix deps.get --check-locked
      - name: Phoenix component regressions (nonempty)
        working-directory: examples/phoenix_native
        env:
          PHOENIX_NATIVE_H3: '1'
        run: python3 ../../scripts/check-tests.py
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: '1.18.5'
          otp-version: '28.5'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: integration/http3/channel_peer/go.sum
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/cache@v6.1.0
        with:
          path: |
            deps
            _build
            examples/phoenix_native/deps
            examples/phoenix_native/_build
          key: protocol-${{ runner.os }}-${{ runner.arch }}-1.18.5-28.5-${{ hashFiles('mix.lock', 'examples/phoenix_native/mix.lock', 'vendor/websock_adapter/SOURCE.json') }}
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get --check-locked
      - name: Certificate tool and independent protocol peers
        run: |
          sudo apt-get update && sudo apt-get install -y openssl
          python -m venv .audit/h2peer
          .audit/h2peer/bin/python -m pip install -r apps/gaoxy_http/test/support/h2-requirements.txt -r integration/http3/requirements.txt
      - name: Ordinary network and protocol regressions (exact counts)
        run: python3 scripts/check-repairs.py protocol
      - name: Independent streaming reverse-proxy example
        env:
          MIX_ENV: test
          GAOXY_PROXY_EVIDENCE: .audit/reverse-proxy
        run: python3 integration/reverse_proxy/run.py
      - name: Independent selected H2 RFC cases
        env:
          MIX_ENV: test
        run: .audit/h2peer/bin/python integration/h2_rfc/run.py --evidence .audit/m3-rfc
      - name: HTTP clients and protocol peers
        run: .audit/h2peer/bin/python -m pip install -r integration/phoenix_native/requirements.txt
      - name: Prepare unified Phoenix fixture
        working-directory: examples/phoenix_native
        env:
          MIX_ENV: dev
          PHOENIX_NATIVE_H2: '1'
          PHOENIX_NATIVE_H3: '1'
          PHOENIX_NATIVE_RELOAD: '1'
        run: |
          mix deps.get --check-locked
          mix compile --warnings-as-errors
      - name: Native Phoenix HTTP, TLS and WebSocket clients
        env:
          PHOENIX_NATIVE_H2: '1'
          GAOXY_PHOENIX_EVIDENCE: .audit/phoenix-clients
        run: .audit/h2peer/bin/python integration/phoenix_native/gate.py
      - name: Unified H1/H2/H3 clients, WebSocket and reload
        env:
          GAOXY_PHOENIX_EVIDENCE: .audit/unified-phoenix
        run: .audit/h2peer/bin/python integration/phoenix_native/unified.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: protocol-evidence
          path: |
            .audit/phoenix-clients/
            .audit/m3-rfc/
            .audit/reverse-proxy/
            .audit/unified-phoenix/
  isolated-network:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: '1.18.5'
          otp-version: '28.5'
      - uses: dtolnay/rust-toolchain@stable
      - name: Provision certificate tool
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y openssl
          certificate_tool="$(command -v openssl)"
          "$certificate_tool" version -a
          echo "OPENSSL_BIN=$certificate_tool" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/cache@v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ runner.arch }}-1.18.5-28.5-${{ hashFiles('mix.lock') }}
      - run: sudo apt-get update && sudo apt-get install -y iproute2 util-linux
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get --check-locked && mix compile --warnings-as-errors
      - name: Isolated IPv4 ingress, memberships, restart and egress
        run: python3 integration/network/fixture.py --allow-privileged
      - name: Isolated Linux IPv6 ingress, scope, hops and loopback
        run: python3 integration/network/fixture.py --allow-privileged --ipv6
      - name: Socket backend IPv4 ingress and egress
        run: GAOXY_UDP_BACKEND=socket python3 integration/network/fixture.py --allow-privileged
      - name: Socket backend IPv6 scoped-send negative
        run: GAOXY_UDP_BACKEND=socket python3 integration/network/fixture.py --allow-privileged --ipv6
      - name: Production five-transport release
        run: MIX_ENV=prod mix release && python3 integration/network/release_gate.py --allow-privileged
      - name: Shipped five-transport custom-handler example
        run: python3 integration/network/example_gate.py --allow-privileged

  release-clients:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GAOXY_E2E_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: HTTP clients and certificate tools
        run: |
          sudo apt-get update && sudo apt-get install -y curl openssl libtinfo6
          python -m venv .audit/released-client-venv
          .audit/released-client-venv/bin/python -m pip install -r integration/e2e/requirements.txt
      - name: Downloaded release with independent clients
        run: .audit/released-client-venv/bin/python integration/e2e/run.py --version "$GAOXY_E2E_VERSION" --evidence .audit/released-clients
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: released-client-evidence
          path: .audit/released-clients/
