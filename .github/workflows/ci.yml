name: Static checks and build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_ERL_OPTIONS: '+S 2:2'

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: '1.18.5'
          otp-version: '28.5'
      - name: Acceptance wrapper counter regressions
        run: python3 scripts/test-check-tests.py
      - name: Canonical formatter (Elixir 1.18.5)
        run: mix format --check-formatted

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            elixir: '1.18.5'
            otp: '28.5'
          - os: macos-15-intel
            elixir: '1.20.1'
            otp: '29.0.2'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ runner.arch }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get --check-locked
      - run: mix compile --warnings-as-errors
