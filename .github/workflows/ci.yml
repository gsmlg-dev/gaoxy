name: Static checks and build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_ERL_OPTIONS: '+S 2:2'

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: '1.18.5'
          otp-version: '28.5'
      - name: Explicit test ownership inventory
        run: python3 scripts/check-test-inventory.py
      - name: Canonical formatter (Elixir 1.18.5)
        run: mix format --check-formatted

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: '1.18.5'
          otp-version: '28.5'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ runner.arch }}-1.18.5-28.5-${{ hashFiles('mix.lock') }}
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get --check-locked
      - run: mix compile --warnings-as-errors
