name: Foundation integration tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  ELIXIR_ERL_OPTIONS: '+S 2:2'
jobs:
  native_http:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: '1.18.5'
          otp-version: '28.5'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/cache@v6.1.0
        with:
          path: |
            deps
            _build
            examples/phoenix_native/deps
            examples/phoenix_native/_build
          key: native-http-${{ runner.os }}-${{ hashFiles('mix.lock', 'examples/phoenix_native/mix.lock', 'vendor/websock_adapter/SOURCE.json') }}
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get --check-locked
      - name: Native protocol and lifecycle regressions
        run: >-
          mix test --warnings-as-errors --max-cases 1
          apps/gaoxy_http/test apps/gaoxy_proxy/test
          apps/gaoxy/test/native_stream_test.exs
          apps/gaoxy/test/cleanup_attachment_test.exs
          apps/gaoxy/test/shutdown_hardening_test.exs
      - name: Independent streaming reverse-proxy example
        env:
          MIX_ENV: test
          GAOXY_PROXY_EVIDENCE: .audit/reverse-proxy
        run: python integration/reverse_proxy/run.py
      - name: Independent Phoenix fixture dependencies
        working-directory: examples/phoenix_native
        run: mix deps.get --check-locked
      - name: Phoenix listener ownership
        working-directory: examples/phoenix_native
        run: mix test --warnings-as-errors
      - name: Browser and independent peer dependencies
        run: |
          python -m pip install -r integration/phoenix_native/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Native Phoenix browser, TLS and WebSocket acceptance
        run: python integration/phoenix_native/run.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: native-http-evidence
          path: |
            .audit/m2-browser/server.log
            .audit/m2-browser/results.json
            .audit/m2-browser/liveview.png
            .audit/reverse-proxy/example-server.log
            .audit/reverse-proxy/example-results.json
  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            elixir: '1.18.5'
            otp: '28.5'
          - os: macos-15-intel
            elixir: '1.20.1'
            otp: '29.0.2'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Provision certificate tool
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install openssl@3
            certificate_tool="$(brew --prefix openssl@3)/bin/openssl"
          else
            sudo apt-get update && sudo apt-get install -y openssl
            certificate_tool="$(command -v openssl)"
          fi
          "$certificate_tool" version -a
          echo "OPENSSL_BIN=$certificate_tool" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/cache@v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ runner.arch }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get --check-locked
      - run: mix compile --warnings-as-errors
      - name: Real loopback sockets (nonempty)
        run: python3 scripts/check-tests.py --only loopback
      - name: External core consumer
        run: bash scripts/external-consumer.sh
      - name: Portable release
        run: MIX_ENV=prod mix release && python3 scripts/release-smoke.py

  isolated-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: '1.18.5'
          otp-version: '28.5'
      - uses: dtolnay/rust-toolchain@stable
      - name: Provision certificate tool
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install openssl@3
            certificate_tool="$(brew --prefix openssl@3)/bin/openssl"
          else
            sudo apt-get update && sudo apt-get install -y openssl
            certificate_tool="$(command -v openssl)"
          fi
          "$certificate_tool" version -a
          echo "OPENSSL_BIN=$certificate_tool" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/cache@v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ runner.arch }}-1.18.5-28.5-${{ hashFiles('mix.lock') }}
      - run: sudo apt-get update && sudo apt-get install -y iproute2 util-linux
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get --check-locked && mix compile --warnings-as-errors
      - name: Isolated IPv4 ingress, memberships, restart and egress
        run: python3 integration/network/fixture.py --allow-privileged
      - name: Isolated Linux IPv6 ingress, scope, hops and loopback
        run: python3 integration/network/fixture.py --allow-privileged --ipv6
      - name: Socket backend IPv4 ingress and egress
        run: GAOXY_UDP_BACKEND=socket python3 integration/network/fixture.py --allow-privileged
      - name: Socket backend IPv6 scoped-send negative
        run: GAOXY_UDP_BACKEND=socket python3 integration/network/fixture.py --allow-privileged --ipv6
      - name: Production five-transport release
        run: MIX_ENV=prod mix release && python3 integration/network/release_gate.py --allow-privileged
      - name: Shipped five-transport custom-handler example
        run: python3 integration/network/example_gate.py --allow-privileged

  optional-quic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: '1.18.5'
          otp-version: '28.5'
      - uses: dtolnay/rust-toolchain@stable
      - name: Provision certificate tool
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install openssl@3
            certificate_tool="$(brew --prefix openssl@3)/bin/openssl"
          else
            sudo apt-get update && sudo apt-get install -y openssl
            certificate_tool="$(command -v openssl)"
          fi
          "$certificate_tool" version -a
          echo "OPENSSL_BIN=$certificate_tool" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/cache@v6.1.0
        with:
          path: |
            integration/quic_consumer/deps
            integration/quic_consumer/_build
          key: mix-quic-${{ runner.os }}-${{ runner.arch }}-1.18.5-28.5-${{ hashFiles('mix.lock', 'integration/quic_consumer/mix.lock') }}
      - run: mix local.hex --force && mix local.rebar --force
      - name: Locked optional consumer and independent validating aioquic peer
        working-directory: integration/quic_consumer
        run: |
          mix deps.get --check-locked
          mix compile --warnings-as-errors
          python3 ../../scripts/check-tests.py

# Configured CI is not an executed GitHub run. s93 isolated-network/release
# evidence is recorded separately from configured optional-consumer acceptance.
