name: Portable HTTP smoke

on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  ELIXIR_ERL_OPTIONS: '+S 2:2'
jobs:
  portable:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            elixir: '1.18.5'
            otp: '28.5'
          - os: macos-15-intel
            elixir: '1.20.1'
            otp: '29.0.2'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: mix local.hex --force && mix local.rebar --force
      - name: One HTTP startup, request and stop
        run: python3 scripts/portable-smoke.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: portable-${{ runner.os }}-evidence
          path: .audit/portable-smoke/
