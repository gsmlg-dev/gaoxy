name: Release application and Hex packages

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: 'Release version (e.g. 1.2.3)'
      expected_sha:
        type: string
        required: true
        description: 'Exact already-versioned commit validated for publication'
      git_ref:
        type: string
        required: true
        default: main
        description: Git ref to release from (branch name)

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ELIXIR_ERL_OPTIONS: '+S 2:2'
  MIX_ENV: prod
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_REF: ${{ inputs.git_ref }}
  RELEASE_EXPECTED_SHA: ${{ inputs.expected_sha }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
      - uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: '1.18.5'
          otp-version: '28.5'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: integration/http3/channel_peer/go.sum
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/cache@v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-prod-${{ runner.os }}-${{ runner.arch }}-1.18.5-28.5-${{ hashFiles('mix.lock') }}
      - name: Validate exact pre-versioned release source
        run: |
          git check-ref-format --branch "$RELEASE_REF"
          git show-ref --verify "refs/remotes/origin/$RELEASE_REF"
          python3 - <<'PYCODE'
          import os
          import pathlib
          import re
          import subprocess

          version = os.environ['RELEASE_VERSION']
          expected = os.environ['RELEASE_EXPECTED_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', expected):
              raise SystemExit('expected_sha must be a full commit SHA')
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if actual != expected:
              raise SystemExit(f'checkout source mismatch: {actual} != {expected}')
          number = r'(?:0|[1-9][0-9]*)'
          prerelease = rf'(?:{number}|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          semver = rf'{number}\.{number}\.{number}(?:-{prerelease}(?:\.{prerelease})*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?'
          if not re.fullmatch(semver, version):
              raise SystemExit('version must be a SemVer without a v prefix')
          tag = f'refs/tags/v{version}'
          if subprocess.run(['git', 'show-ref', '--verify', '--quiet', tag]).returncode == 0:
              raise SystemExit(f'release tag already exists: v{version}')
          paths = [pathlib.Path('mix.exs'), *sorted(pathlib.Path('apps').glob('*/mix.exs'))]
          for path in paths:
              versions = re.findall(r'\bversion:\s*"([^"\n]+)"', path.read_text())
              if versions != [version]:
                  raise SystemExit(f'version must already be committed: {path}: {versions}')
          PYCODE
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get --check-locked
      - name: Hex packaging regressions
        run: python3 scripts/test-stage-hex-packages.py
      - name: Pinned ordinary repair peers
        run: |
          python -m venv .audit/h2peer
          .audit/h2peer/bin/python -m pip install -r apps/gaoxy_http/test/support/h2-requirements.txt -r integration/http3/requirements.txt
      - name: Isolated core, HTTP, H3 and Gateway consumers on publication source
        env:
          GAOXY_CONSUMER_DEPS: ${{ github.workspace }}/deps
          GAOXY_QUIC_PYTHON: ${{ github.workspace }}/.audit/h2peer/bin/python
        run: |
          bash scripts/external-consumer.sh
          bash scripts/http-consumer.sh
          bash scripts/h3-consumer.sh
          bash scripts/gateway-consumer.sh
          bash scripts/h3-gateway-consumer.sh
      - name: Correctness repair and ordinary compatibility on publication source
        run: python3 scripts/check-repairs.py all
      - name: Built-package test consumers and production dependency isolation
        env:
          MIX_ENV: test
        run: python3 scripts/test-consumers.py
      - name: Unified Phoenix HTTP-client and peer dependencies
        run: |
          python -m pip install -r integration/phoenix_native/requirements.txt -r integration/http3/requirements.txt
      - name: Prepare unified Phoenix publication fixture
        working-directory: examples/phoenix_native
        env:
          MIX_ENV: dev
          PHOENIX_NATIVE_H2: '1'
          PHOENIX_NATIVE_H3: '1'
          PHOENIX_NATIVE_RELOAD: '1'
        run: |
          mix deps.get --check-locked
          mix compile --warnings-as-errors
      - name: Unified Endpoint H1/H2/H3 clients, WebSocket and reload acceptance
        env:
          GAOXY_PHOENIX_EVIDENCE: .audit/release-unified-phoenix
        run: python integration/phoenix_native/unified.py
      - name: Phoenix client-certificate, large-message and streaming regressions
        working-directory: examples/phoenix_native
        env:
          MIX_ENV: test
          PHOENIX_NATIVE_H3: '1'
        run: python3 ../../scripts/check-tests.py test/client_certificate_test.exs test/websocket_configured_limits_test.exs test/websocket_default_capacity_test.exs test/stream_lifetime_test.exs test/websocket_phoenix_compatibility_test.exs test/resource_budget_test.exs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: release-unified-phoenix-evidence
          path: |
            .audit/release-unified-phoenix/server.log
            .audit/release-unified-phoenix/report.json
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix release gaoxy
      - name: Standalone core and native H1/H2 gateway release smoke
        run: |
          python3 scripts/release-smoke.py
          .audit/h2peer/bin/python scripts/gateway-release-smoke.py
          .audit/h2peer/bin/python scripts/h3-release-smoke.py --evidence .audit/release-h3
      - name: Package Linux x86_64 application
        run: |
          mkdir -p dist
          tar -C _build/prod/rel/gaoxy -czf "dist/gaoxy-${RELEASE_VERSION}-linux-x86_64.tar.gz" .
          cd dist
          sha256sum "gaoxy-${RELEASE_VERSION}-linux-x86_64.tar.gz" > SHA256SUMS
      - name: Build all Hex packages before publication
        run: |
          elixir scripts/stage-hex-packages.exs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/gaoxy-hex"
          packages=(gaoxy_websock_adapter gaoxy gaoxy_http gaoxy_http3 gaoxy_proxy gaoxy_test)
          for app in "${packages[@]}"; do
            (cd "$RUNNER_TEMP/gaoxy-hex/$app" && mix hex.build --output "$GITHUB_WORKSPACE/dist/${app}-${RELEASE_VERSION}.tar")
            (cd dist && sha256sum "${app}-${RELEASE_VERSION}.tar" >> SHA256SUMS)
          done
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: gaoxy-${{ inputs.version }}-linux-x86_64
          path: dist/*
          if-no-files-found: error
      - name: Recheck publication source before irreversible upload
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_EXPECTED_SHA"
          test "$(git ls-remote origin "refs/heads/$RELEASE_REF" | cut -f1)" = "$RELEASE_EXPECTED_SHA"
          git diff --exit-code
      - name: Publish and verify Hex packages
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          : "${HEX_API_KEY:?Set the HEX_API_KEY Actions secret to publish packages}"
          packages=(gaoxy_websock_adapter gaoxy gaoxy_http gaoxy_http3 gaoxy_proxy gaoxy_test)
          for app in "${packages[@]}"; do
            (cd "$RUNNER_TEMP/gaoxy-hex/$app" && mix deps.get --only prod && mix hex.publish package --yes)
          done
          for app in "${packages[@]}"; do
            package="${app}-${RELEASE_VERSION}.tar"
            curl --fail --silent --show-error --location --retry 5 --retry-delay 5 \
              --retry-all-errors --max-time 30 \
              "https://repo.hex.pm/tarballs/$package" --output "$RUNNER_TEMP/$package"
            cmp "dist/$package" "$RUNNER_TEMP/$package"
          done
      - name: Tag the validated source without generating source changes
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_EXPECTED_SHA"
          git diff --exit-code
          git tag "v${RELEASE_VERSION}"
          git push origin "refs/tags/v${RELEASE_VERSION}"
      - name: Fresh Hex-only test consumers after publication
        env:
          MIX_ENV: test
        run: python3 scripts/test-consumers.py --published --version "$RELEASE_VERSION"
      - name: Create GitHub Release with application artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=(--generate-notes)
          if [[ -f "docs/releases/${RELEASE_VERSION}.md" ]]; then
            notes=(--notes-file "docs/releases/${RELEASE_VERSION}.md")
          fi
          gh release create "v${RELEASE_VERSION}" dist/* \
            --verify-tag "${notes[@]}" --title "Gaoxy v${RELEASE_VERSION}"
