name: Release application and Hex packages

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: 'Release version (e.g. 1.2.3)'
      git_ref:
        type: string
        required: true
        default: main
        description: Git ref to release from (branch name)

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_ERL_OPTIONS: '+S 2:2'
  MIX_ENV: prod
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_REF: ${{ inputs.git_ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
      - uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: '1.18.5'
          otp-version: '28.5'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/cache@v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-prod-${{ runner.os }}-${{ runner.arch }}-1.18.5-28.5-${{ hashFiles('mix.lock') }}
      - name: Validate release target and synchronize umbrella versions
        run: |
          git check-ref-format --branch "$RELEASE_REF"
          git show-ref --verify "refs/remotes/origin/$RELEASE_REF"
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import subprocess

          version = os.environ['RELEASE_VERSION']
          number = r'(?:0|[1-9][0-9]*)'
          prerelease = rf'(?:{number}|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          semver = rf'{number}\.{number}\.{number}(?:-{prerelease}(?:\.{prerelease})*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?'
          if not re.fullmatch(semver, version):
              raise SystemExit('version must be a SemVer without a v prefix')
          tag = f'refs/tags/v{version}'
          if subprocess.run(['git', 'show-ref', '--verify', '--quiet', tag]).returncode == 0:
              raise SystemExit(f'release tag already exists: v{version}')
          paths = [pathlib.Path('mix.exs'), *sorted(pathlib.Path('apps').glob('*/mix.exs'))]
          pattern = r'(\bversion:\s*")[^"]+(")'
          updates = []
          for path in paths:
              text = path.read_text()
              updated, count = re.subn(pattern, lambda match: f'{match[1]}{version}{match[2]}', text)
              if count != 1:
                  raise SystemExit(f'expected exactly one version declaration: {path}')
              updates.append((path, updated))
          for path, updated in updates:
              path.write_text(updated)
          PY
      - run: mix local.hex --force && mix local.rebar --force
      - run: mix deps.get --check-locked
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix release gaoxy
      - name: Pinned independent native H2 peer
        run: |
          python -m venv .audit/h2peer
          .audit/h2peer/bin/python -m pip install -r apps/gaoxy_http/test/support/h2-requirements.txt
      - name: Standalone core and native H1/H2 gateway release smoke
        run: |
          python3 scripts/release-smoke.py
          .audit/h2peer/bin/python scripts/gateway-release-smoke.py
      - name: Package Linux x86_64 application
        run: |
          mkdir -p dist
          tar -C _build/prod/rel/gaoxy -czf "dist/gaoxy-${RELEASE_VERSION}-linux-x86_64.tar.gz" .
          cd dist
          sha256sum "gaoxy-${RELEASE_VERSION}-linux-x86_64.tar.gz" > SHA256SUMS
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: gaoxy-${{ inputs.version }}-linux-x86_64
          path: dist/*
          if-no-files-found: error
      - name: Build and publish Hex packages
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          : "${HEX_API_KEY:?Set the HEX_API_KEY repository secret to publish packages}"
          packages=(gaoxy gaoxy_http gaoxy_http3 gaoxy_proxy)
          # Validate every library before publishing any of them.
          for app in "${packages[@]}"; do
            (cd "apps/$app" && mix hex.build --output "${RUNNER_TEMP}/${app}-${RELEASE_VERSION}.tar")
          done
          for app in "${packages[@]}"; do
            (cd "apps/$app" && mix hex.publish package --yes)
          done
      - name: Commit version bump and push release tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- mix.exs apps/*/mix.exs; then
            git commit -am "chore(release): v${RELEASE_VERSION}"
          fi
          git tag "v${RELEASE_VERSION}"
          git push --atomic origin "HEAD:refs/heads/${RELEASE_REF}" "refs/tags/v${RELEASE_VERSION}"
      - name: Create GitHub Release with application artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=(--generate-notes)
          if [[ -f "docs/releases/${RELEASE_VERSION}.md" ]]; then
            notes=(--notes-file "docs/releases/${RELEASE_VERSION}.md")
          fi
          gh release create "v${RELEASE_VERSION}" dist/* \
            --verify-tag "${notes[@]}" --title "Gaoxy v${RELEASE_VERSION}"
